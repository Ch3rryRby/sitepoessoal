<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arquivo</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- 404 -->
    <div id="error" class="screen">
        <h1>404</h1>
        <p>Arquivo não encontrado</p>
    </div>


    <!-- LOADING -->
    <div id="loading" class="screen hidden">
        <h2>
            Loading
            <span class="dots">
                <span>.</span>
                <span>.</span>
                <span>.</span>
            </span>
        </h2>

        <p class="enter-text">Pressione ENTER para continuar</p>
    </div>


    <!-- ABRINDO ARQUIVO -->
    <div id="opening" class="screen hidden">
        <h2>
            Abrindo arquivo
            <span class="dots">
                <span>.</span>
                <span>.</span>
                <span>.</span>
            </span>
        </h2>
    </div>


    <!-- LOADING FINAL -->
    <div id="final" class="screen hidden">

        <div class="loader"></div>

        <h2>LOADING</h2>

    </div>


    <script>

        const error = document.getElementById("error");
        const loading = document.getElementById("loading");
        const opening = document.getElementById("opening");
        const final = document.getElementById("final");


        // Depois de 3 segundos, sai do 404
        // e mostra o Loading
        setTimeout(() => {

            error.classList.add("hidden");
            loading.classList.remove("hidden");

        }, 3000);


        // Detecta a tecla ENTER
        document.addEventListener("keydown", function(event) {

            if (event.key === "Enter") {

                // Só funciona quando estiver no Loading
                if (!loading.classList.contains("hidden")) {

                    // Esconde Loading
                    loading.classList.add("hidden");

                    // Mostra "Abrindo arquivo"
                    opening.classList.remove("hidden");


                    // Depois de 3 segundos,
                    // mostra o Loading final
                    setTimeout(() => {

                        opening.classList.add("hidden");

                        final.classList.remove("hidden");

                    }, 3000);

                }

            }

        });

    </script>

</body>

</html>
