<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arquivo</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- 1. ARQUIVO NÃO ENCONTRADO -->
    <div id="error404" class="screen">
        <h1>404</h1>
        <p>Arquivo não encontrado</p>
    </div>

    <!-- 2. LOADING COM 3 PONTOS -->
    <div id="initialLoading" class="screen">
        <div>
            Loading
            <span class="dots">
                <span>.</span>
                <span>.</span>
                <span>.</span>
            </span>
        </div>
    </div>

    <!-- 3. ABRINDO ARQUIVO -->
    <div id="openingFile" class="screen">
        <div>
            Abrindo arquivo
            <span class="dots">
                <span>.</span>
                <span>.</span>
                <span>.</span>
            </span>
        </div>
    </div>

    <!-- 4. LOADING FINAL GIRANDO -->
    <div id="finalLoading" class="screen">
        <div class="loader"></div>
        <h2>LOADING</h2>
    </div>


    <script>

        const error404 = document.getElementById("error404");
        const initialLoading = document.getElementById("initialLoading");
        const openingFile = document.getElementById("openingFile");
        const finalLoading = document.getElementById("finalLoading");


        // Começa mostrando o 404
        error404.style.display = "flex";


        // Depois de 3 segundos → Loading...
        setTimeout(() => {

            error404.style.display = "none";

            initialLoading.style.display = "flex";
            initialLoading.classList.add("fade");

        }, 3000);


        // Depois de 3 segundos → Abrindo arquivo...
        setTimeout(() => {

            initialLoading.style.display = "none";

            openingFile.style.display = "flex";
            openingFile.classList.add("fade");

        }, 6000);


        // Depois de 3 segundos → Loading girando
        setTimeout(() => {

            openingFile.style.display = "none";

            finalLoading.style.display = "flex";
            finalLoading.classList.add("fade");

        }, 9000);

    </script>

</body>
</html>
